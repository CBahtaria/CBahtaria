<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Charles Bartaria — Solo Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#0d1525"/>
    </linearGradient>
    <linearGradient id="band1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff006e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff006e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0e1a2e" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.6"/>
  <rect x="0" y="0" width="400" height="300" fill="url(#band1)"/>
  <rect x="400" y="0" width="400" height="300" fill="url(#band2)"/>
  <rect x="800" y="0" width="400" height="300" fill="url(#band3)"/>
  <line x1="400" y1="40" x2="400" y2="260" stroke="#1a2238" stroke-width="1"/>
  <line x1="800" y1="40" x2="800" y2="260" stroke="#1a2238" stroke-width="1"/>
  <g transform="translate(110 130)" stroke="#06b6d4" stroke-width="2" fill="none">
    <circle cx="50" cy="30" r="9" fill="#06b6d4"/>
    <line x1="50" y1="30" x2="15" y2="0"/>
    <line x1="50" y1="30" x2="85" y2="0"/>
    <line x1="50" y1="30" x2="15" y2="60"/>
    <line x1="50" y1="30" x2="85" y2="60"/>
    <circle cx="15" cy="0" r="6" fill="#0a0f1c"/>
    <circle cx="85" cy="0" r="6" fill="#0a0f1c"/>
    <circle cx="15" cy="60" r="6" fill="#0a0f1c"/>
    <circle cx="85" cy="60" r="6" fill="#0a0f1c"/>
  </g>
  <text x="280" y="140" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="700" fill="#e2e8f0" letter-spacing="1">Charles Bartaria</text>
  <text x="280" y="178" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#06b6d4" letter-spacing="1.2">Solo engineer  ·  Autonomous aerial systems  ·  DAL-A discipline</text>
  <g transform="translate(280 210)" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">
    <text x="0" y="14"><tspan fill="#06b6d4">Reactive</tspan> 1 kHz   ·   <tspan fill="#8b5cf6">Executive</tspan> 10–50 Hz   ·   <tspan fill="#ff006e">Advisory</tspan> cloud/local</text>
    <text x="0" y="34">PX4  ·  ROS 2 Jazzy  ·  NATS  ·  Claude + Ollama  ·  Python 3.12  ·  Mbabane, Eswatini</text>
  </g>
</svg>
